# 出征准备页面颜色 (配对坐标见 coordinates/battle_prep.yaml)

fleet_active: {rgb: [16, 133, 228], tolerance: 30.0}    # 舰队标签选中态蓝色
panel_active: {rgb: [30, 139, 240], tolerance: 30.0}    # 面板标签选中态蓝色
auto_supply_on: {rgb: [13, 140, 233], tolerance: 30.0}  # 自动补给启用态蓝色
support_enable: {rgb: [228, 182, 60]}                   # 战役支援启用黄色
support_disable: {rgb: [44, 142, 239]}                  # 战役支援禁用蓝色
support_exhausted: {rgb: [143, 145, 154]}               # 战役支援次数用尽灰色

# 状态检测通用容差 (STATE_TOLERANCE)
state_tolerance: 30.0
