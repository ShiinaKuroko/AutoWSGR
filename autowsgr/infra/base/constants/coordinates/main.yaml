# 首页坐标 (1280x720 绝对像素)
# 层级与游戏菜单树一致, 引用格式: main.<节点>.<子节点> (如 main.backyard.dormitory)
# 子场景内部坐标 (浴场/食堂等) 见各自场景文件

# ── 底部功能栏 (叶子按钮, 点击跳转新页面) ──
task: [875, 651]      # 任务
dock: [1017, 652]     # 船坞
sortie: [1207, 653]   # 出征

# ── 其他入口 ──
event: [1132, 348]    # 活动入口 (旧代码硬编码值换算)

# ── 后院 (enter=首页入口按钮, 其余=后院场景内建筑, 用户实测新值) ──
backyard:
  enter: [62, 112]       # 首页 → 后院
  dormitory: [148, 447]  # 宿舍
  bath: [387, 256]       # 浴场 (场景内部坐标见 bath.yaml)
  admiralty: [727, 178]  # 提督府
  rank_room: [895, 137]  # 军阶室
  collection: [960, 241] # 收藏室
  academy: [1170, 293]   # 学院
  theater: [702, 438]    # 放映厅
  canteen: [1023, 471]   # 餐厅 (场景内部坐标见 canteen.yaml)
  back: [64, 47]         # 返回上一级 ◁ (后院 → 首页)
  back_home: [168, 49]   # 返回首页 (仅后院二级页面显示)

# ── 菜单/侧边栏 (enter=首页 ≡ 按钮, 其余=侧边栏展开后, 旧代码值) ──
menu:
  enter: [66, 646]              # 首页 → 侧边栏
  close: [56, 645]              # 关闭侧边栏
  build: [200, 267]             # 建造
  intensify: [200, 360]         # 改造
  friend: [200, 547]            # 好友
  build_submenu: [480, 267]     # 建造二级: 普通建造
  intensify_submenu: [480, 360] # 改造二级: 普通改造

# ── 状态探测点 (单像素颜色采样, 配对颜色见 colors/main.yaml) ──
probes:
  expedition_ready: [1244, 605]  # 右下角远征完成红点 (0.9719, 0.8407)
  task_ready: [925, 609]         # 任务按钮红点 (0.7229, 0.8463)

# ── 浮层/弹窗消除点击 ──
dismiss:
  news_not_show: [85, 648]       # 新闻「不再显示」复选框 (5.6.0 版式)
  news_close: [45, 45]           # 新闻关闭按钮 (5.6.0 版式)
  sign_confirm: [632, 476]       # 签到领取/关闭按钮
  booking: [791, 406]            # 预约页面关闭坐标
  user_info_close: [1123, 159]   # 提督信息浮层关闭 (右上角 X)
