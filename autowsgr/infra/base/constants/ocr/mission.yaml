# 任务页面 OCR / 识别参数, 引用格式: ocr.mission.<键>

# 按钮扫描区域 (右侧按钮列, ROI: x1,y1,x2,y2)
button_scan_roi: [0.86, 0.17, 0.96, 0.85]

# 扫描步长 (相对坐标)
scan_x: 0.91         # 按钮中心 x
scan_y_step: 0.005   # y 步进

# 聚类阈值: 相对 y 距离小于此值视为同一按钮
# 「领取」按钮中央文字区域会产生 ~0.04 的颜色间断, 需 >= 0.05 才能合并
cluster_gap: 0.06
min_cluster_size: 3  # 低于此值的簇视为噪点而非真实按钮

# 宽按钮 (一键领取) 过滤: 检测 x 坐标
wide_btn_check_x: 0.80

# 名称裁切区域上边界: name_top < 此值表示名称被页面标题栏遮挡, 不可读
name_crop_min_y: 0.12

# OCR 置信度下限: 低于此值视为无效识别
ocr_confidence_min: 0.10

# 名称裁切 (相对按钮中心)
name_roi:
  x1: 0.22
  x2: 0.60
  y_offset: -0.145   # 名称中心在按钮中心上方 (负值)
  y_pad: 0.035       # 名称区域上下半高

# 进度裁切 (相对按钮中心)
progress_roi:
  x1: 0.75
  x2: 0.87
  y_offset: 0.105
  y_pad: 0.035
