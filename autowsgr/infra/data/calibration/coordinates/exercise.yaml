# 演习面板坐标 (1280x720 绝对像素)
# 引用格式: exercise.<键>; 配对颜色见 colors/exercise.yaml

# ── 对手挑战按钮 (旧 RIVAL_POSITIONS, 备用) ──
rival_positions:
  - [1024, 160]               # 对手 1 (0.800, 0.222)
  - [1024, 320]               # 对手 2 (0.800, 0.444)
  - [1024, 480]               # 对手 3 (0.800, 0.667)
  - [1024, 640]               # 对手 4 (0.800, 0.889)

# 通用挑战按钮 (旧 CLICK_CHALLENGE, 备用)
click_challenge: [1024, 360]

# 4 个可见对手位置的挑战按钮探测点 (第 5 个需滚动, 蓝色=可挑战)
challenge_probes:
  - [1027, 133]               # 位置 1 (~0.8021, 0.1852)
  - [1027, 280]               # 位置 2 (~0.8021, 0.3889)
  - [1027, 427]               # 位置 3 (~0.8021, 0.5926)
  - [1027, 573]               # 位置 4 (~0.8021, 0.7963)

# ── 列表滚动 ──
# 上下箭头探测点 (灰色=已到顶/底, 配对 colors/exercise.yaml arrow_gray)
arrow_up_probe: [1244, 79]    # 上箭头 (~0.9719, 0.1093)
arrow_down_probe: [1244, 652] # 下箭头 (~0.9719, 0.9056)

# 滑动 (起点 → 终点, 相对坐标由 start/end 两点归一化)
swipe_to_top:
  start: [1067, 267]          # (~0.8333, 0.3704)
  end: [1067, 533]            # (~0.8333, 0.7407)
swipe_to_bottom:
  start: [1067, 533]
  end: [1067, 267]

# ── 对手信息页按钮 ──
click_rival_info: [887, 533]      # 刷新对手阵容 (~0.6927, 0.7407)
click_start_battle: [1072, 520]   # 开始战斗 (~0.8375, 0.7222)
